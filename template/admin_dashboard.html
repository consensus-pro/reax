<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reax - 管理员后台</title>
<style>
*{margin: 0;padding: 0;box-sizing: border-box;-webkit-tap-highlight-color: rgba(0, 0, 0, 0);font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
body{background:#fff;min-height:100vh;padding:20px;position:relative}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(0,0,0,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.03)1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}
.c{max-width:900px;margin:0 auto;position:relative;z-index:1}
.i{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.is{width:14px;height:14px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.im{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.il{width:28px;height:28px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.iw{filter:brightness(0)invert(1)}
.sp{animation:spn 1.2s linear infinite;display:inline-block}
@keyframes spn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hd{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 24px;border-radius:10px;margin-bottom:20px;border:1px solid #e5e5e5}
.hd h1{font-size:18px;font-weight:700;color:#0a0a0a;display:flex;align-items:center;gap:8px}
.hd .bt{padding:8px 18px;background:#f8f8f8;color:#333;border:1px solid #e5e5e5;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s;display:flex;align-items:center;gap:6px}
.hd .bt:hover{background:#e5e5e5}
.hd .bt .i{filter:brightness(0)saturate(100%)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.sc{background:#fff;padding:16px 20px;border-radius:10px;text-align:center;border:1px solid #e5e5e5}
.sc .nu{font-size:28px;font-weight:700;color:#0a0a0a}
.sc .lb{color:#888;font-size:13px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.fs{background:#fff;border:1px solid #e5e5e5;border-radius:10px;margin-bottom:20px;overflow:hidden}
.fh{padding:14px 20px;background:#f8f8f8;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.fh span{font-weight:600;color:#333;display:flex;align-items:center;gap:6px}
.fb{padding:0 16px;max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease}
.fb.op{max-height:500px;padding:8px 16px;opacity:1;overflow-y:auto}
.mi{padding:8px 0;border-bottom:1px solid #e5e5e5}
.mi:last-child{border-bottom:none}
.mi .mt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mi .mt .mx{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px;flex:1;min-width:0}
.mi .mt .mx .mu{font-weight:600;color:#1677ff;font-size:12px;flex-shrink:0}
.mi .mt .mx .mu::after{content:': ';color:#1677ff}
.mi .mt .mx .mc{color:#333;font-size:10px;word-break:break-word;flex:1;min-width:0}
.mi .mt .md {padding: 0 3px;height: 18px;line-height: 18px;background: #d9534f;color: #fff;border: none;border-radius: 4px;cursor: pointer;font-size: 10px;flex: 0 0 auto;width: auto;min-width: 0;box-sizing: border-box;}
.mi .mt .md:hover{background:#c9302c}
.mi .mt2{color:#bbb;font-size:6px;margin-top:1px;padding-left:0}
.ep{text-align:center;padding:30px 0;color:#aaa;font-size:14px}
.lo{text-align:center;padding:30px 0;color:#aaa;display:flex;align-items:center;justify-content:center;gap:6px}
.ui .bgp{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.ui .bs{padding:4px 8px;border:none;border-radius:6px;cursor:pointer;font-size:11px;transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;gap:3px;flex-shrink:0}
.bd{background:#0a0a0a;color:#fff}
.bd:hover{background:#222}
.bx{background:#d9534f;color:#fff}
.bx:hover{background:#c9302c}
.br,.bp{background:#0a0a0a;color:#fff}
.br:hover,.bp:hover{background:#222}
.ui{display:grid;grid-template-columns:1.2fr 1.8fr 1.2fr 2fr;padding:8px 10px;border-bottom:1px solid #f1f3f5;align-items:center;color:#333;font-size:13px;gap:6px}
.ui:last-child{border-bottom:none}
.ui .un{font-weight:600;color:#0a0a0a;font-size:13px}
.ui .em{color:#888;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui .dt{color:#888;font-size:11px;white-space:nowrap}
.ui .ab{background:#0a0a0a;color:#fff;font-size:10px;padding:1px 8px;border-radius:10px;display:inline-block;margin-left:4px}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:999;justify-content:center;align-items:center}
.mo.ac{display:flex}
.md{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,0.2)}
.md h3{font-size:18px;margin-bottom:16px;text-align:center}
.md .ib{margin-bottom:16px}
.md .ib input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
.md .ib input:focus{border-color:#0a0a0a}
.md .brw{display:flex;gap:10px}
.md .brw .bt{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.md .brw .bc{background:#0a0a0a;color:#fff}
.md .brw .bc .i{filter:brightness(0)invert(1)}
.md .brw .bc:hover{background:#222}
.md .brw .bv{background:#f0f0f0;color:#333}
.md .brw .bv:hover{background:#e0e0e0}
.af{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.af .sw{display:flex;align-items:center;gap:8px}
.af .sw input[type="checkbox"]{width:40px;height:22px;appearance:none;background:#ccc;border-radius:11px;position:relative;outline:none;transition:.2s;cursor:pointer;flex-shrink:0}
.af .sw input[type="checkbox"]:checked{background:#0a0a0a}
.af .sw input[type="checkbox"]::after{content:'';position:absolute;top:50%;transform:translateY(-50%);left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.af .sw input[type="checkbox"]:checked::after{left:calc(100% - 20px)}
.af input,.af textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.af input:focus,.af textarea:focus{border-color:#0a0a0a}
.af textarea{resize:vertical;min-height:80px}
.af .bsb{padding:10px 20px;background:#0a0a0a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;align-self:flex-start}
.af .bsb .i{filter:brightness(0)invert(1)}
.af .bsb:hover{background:#222}
input[type="checkbox"]{accent-color:#000}
.ar{transition:transform .3s ease}
.ar.rt{transform:rotate(90deg)}
.si{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f3f5;font-size:13px}
.si:last-child{border-bottom:none}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;padding:4px 0}
.sg .sc2{text-align:center;padding:6px 4px;background:#f8f8f8;border-radius:6px}
.sg .sc2 .sn{font-weight:700;color:#0a0a0a;font-size:16px}
.sg .sc2 .sl{font-size:11px;color:#888}
@media (max-width:640px){.st{grid-template-columns:1fr 1fr}.ui{grid-template-columns:1fr;gap:4px;padding:10px 12px}.ui .bgp{justify-content:flex-start;flex-wrap:wrap}.ui .bs{padding:4px 8px;font-size:11px}.mi .mt{flex-wrap:wrap}.mi .mt .md{margin-left:auto}}
</style>
</head>
<body>

<div class="bg"></div>
<div class="c">

<div class="hd">
<h1><img src="/svg/admin.svg" class="il"> 管理后台</h1>
<button class="bt" id="logoutBtn"><img src="/svg/exit.svg" class="i"> 退出</button>
</div>

<div class="st">
<div class="sc"><div class="nu" id="totalUsers">0</div><div class="lb"><img src="/svg/users.svg" class="i"> 总用户数</div></div>
<div class="sc"><div class="nu" id="todayUsers">0</div><div class="lb"><img src="/svg/register.svg" class="i"> 今日注册</div></div>
</div>

<div class="fs">
<div class="fh" id="msgToggle"><span><img src="/svg/chat.svg" class="i"> 消息管理 <span id="msgCount">(0)</span></span><span id="msgArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="msgBody"><div id="msgListContainer"></div></div>
</div>

<div class="fs">
<div class="fh" id="userToggle"><span><img src="/svg/users.svg" class="i"> 用户管理 <span id="userCount">(0)</span></span><span id="userArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="userBody"><div id="userListContainer"></div></div>
</div>

<div class="fs">
<div class="fh" id="statsToggle"><span><img src="/svg/data.svg" class="i"> 访问统计 <span id="statsCount">(0)</span></span><span id="statsArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="statsBody"><div id="statsListContainer"></div></div>
</div>

<div class="fs">
<div class="fh" id="announceToggle"><span><img src="/svg/net.svg" class="i"> 公告</span><span id="announceArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="announceBody">
<div class="af">
<div class="sw"><label>公告开关</label><input type="checkbox" id="announceSwitch"></div>
<input type="text" id="announceTitle" placeholder="公告标题">
<textarea id="announceContent" placeholder="公告内容"></textarea>
<button class="bsb" id="announceSubmit">确定</button>
</div>
</div>
</div>
</div>

<div class="mo" id="resetPwdModal">
<div class="md">
<h3>修改密码</h3>
<div class="ib"><input type="password" id="newPwdInput" placeholder="输入新密码"></div>
<div class="brw"><button class="bt bv" id="resetPwdCancel">取消</button><button class="bt bc" id="resetPwdConfirm"><img src="/svg/lock.svg" class="is"> 确认</button></div>
</div>
</div>

<div class="mo" id="updatePointsModal">
<div class="md">
<h3>修改积分</h3>
<div class="ib"><input type="number" id="pointsInput" placeholder="输入积分（支持负数）" step="1"></div>
<div class="brw"><button class="bt bv" id="pointsCancel">取消</button><button class="bt bc" id="pointsConfirm"><img src="/svg/coins.svg" class="is"> 确认</button></div>
</div>
</div>

<template id="tpl-loading">
<div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div>
</template>

<template id="tpl-empty">
<div class="ep">暂无数据</div>
</template>

<template id="tpl-error">
<div class="ep" data-field="message">加载失败</div>
</template>

<template id="tpl-user-item">
<div class="ui">
<span class="un" data-field="username"></span>
<span class="em" data-field="email"></span>
<span class="dt" data-field="created_at"></span>
<span class="bgp" data-field="actions"></span>
</div>
</template>

<template id="tpl-message-item">
<div class="mi" data-id="">
<div class="mt">
<div class="mx">
<span class="mu" data-field="username"></span>
<span class="mc" data-field="content"></span>
</div>
<button class="md" data-id="" type="button">删除</button>
</div>
<div class="mt2" data-field="created_at"></div>
</div>
</template>

<template id="tpl-stats-item">
<div class="si">
<span data-field="path"></span>
<span data-field="count"></span>
</div>
</template>

<template id="tpl-stats-card">
<div class="sc2">
<div class="sn" data-field="count">0</div>
<div class="sl" data-field="label">页面</div>
</div>
</template>

<template id="tpl-user-actions-normal">
<a href="" class="bs bd" data-field="detail_link">详细</a>
<button class="bs br" data-id="" data-action="resetPwd">修改密码</button>
<button class="bs bp" data-id="" data-action="updatePoints">修改积分</button>
<button class="bs bx" data-id="" data-action="deleteUser">删除</button>
</template>

<template id="tpl-user-actions-admin">
<span style="color:#888;font-size:13px;">-</span>
</template>

<script src="/api/toast.js"></script>
<script>
"use strict";

function cloneTemplate(id) {
var tpl = document.getElementById(id);
return tpl.content.cloneNode(true);
}

function fillText(el, selector, text) {
var target = el.querySelector(selector);
if (target) target.textContent = text;
}

function fillHtml(el, selector, html) {
var target = el.querySelector(selector);
if (target) target.innerHTML = html;
}

function setAttr(el, selector, attr, value) {
var target = el.querySelector(selector);
if (target) target.setAttribute(attr, value);
}

var $ = function(id) { return document.getElementById(id); };

function isToday(dateStr) {
var t = new Date(dateStr);
var n = new Date();
return t.getDate() === n.getDate() && t.getMonth() === n.getMonth() && t.getFullYear() === n.getFullYear();
}

async function apiCall(url, method, body) {
var opts = {
method: method || 'GET',
headers: { 'Content-Type': 'application/json' },
credentials: 'include'
};
if (body) opts.body = JSON.stringify(body);
var r = await fetch(url, opts);
return await r.json();
}

var ul = $('userListContainer');
var tu = $('totalUsers');
var tdd = $('todayUsers');
var uc = $('userCount');
var mt = $('msgToggle');
var mb = $('msgBody');
var ma = $('msgArrow');
var ml = $('msgListContainer');
var mc2 = $('msgCount');
var ut = $('userToggle');
var ub = $('userBody');
var ua = $('userArrow');
var at = $('announceToggle');
var ab2 = $('announceBody');
var aa = $('announceArrow');
var asw = $('announceSwitch');
var ati = $('announceTitle');
var acn = $('announceContent');
var asb = $('announceSubmit');
var rp = $('resetPwdModal');
var np = $('newPwdInput');
var rc = $('resetPwdCancel');
var rcc = $('resetPwdConfirm');
var up = $('updatePointsModal');
var pi2 = $('pointsInput');
var pc = $('pointsCancel');
var pc2 = $('pointsConfirm');
var stt = $('statsToggle');
var stb = $('statsBody');
var sta = $('statsArrow');
var stl = $('statsListContainer');
var stc = $('statsCount');

var cru = null;
var cpu = null;
var uload = false;
var mload = false;
var aload = false;
var sload = false;
var uopen = false;
var mopen = false;
var aopen = false;
var sopen = false;

function renderLoading(container) {
container.innerHTML = '';
var clone = cloneTemplate('tpl-loading');
container.appendChild(clone);
}

function renderEmpty(container) {
container.innerHTML = '';
var clone = cloneTemplate('tpl-empty');
container.appendChild(clone);
}

function renderError(container, msg) {
container.innerHTML = '';
var clone = cloneTemplate('tpl-error');
var msgEl = clone.querySelector('[data-field="message"]');
if (msgEl) msgEl.textContent = msg || '加载失败';
container.appendChild(clone);
}

function renderUserItem(user) {
var clone = cloneTemplate('tpl-user-item');
fillText(clone, '[data-field="username"]', user.username + (user.is_admin ? ' <span class="ab">管理员</span>' : ''));
fillText(clone, '[data-field="email"]', user.email);
fillText(clone, '[data-field="created_at"]', user.created_at || '未知');

var actionsContainer = clone.querySelector('[data-field="actions"]');
if (user.is_admin) {
var adminClone = cloneTemplate('tpl-user-actions-admin');
actionsContainer.appendChild(adminClone);
} else {
var normalClone = cloneTemplate('tpl-user-actions-normal');
var detailLink = normalClone.querySelector('[data-field="detail_link"]');
if (detailLink) detailLink.href = '/user?id=' + encodeURIComponent(user.username);
var btns = normalClone.querySelectorAll('button[data-id]');
btns.forEach(function(btn) {
btn.dataset.id = user.id;
});
actionsContainer.appendChild(normalClone);
}
return clone;
}

function renderUserList(container, users) {
container.innerHTML = '';
if (!users || users.length === 0) {
renderEmpty(container);
return;
}
var fragment = document.createDocumentFragment();
users.forEach(function(user) {
var clone = renderUserItem(user);
fragment.appendChild(clone);
});
container.appendChild(fragment);
}

function renderMessageItem(msg) {
var clone = cloneTemplate('tpl-message-item');
clone.firstElementChild.dataset.id = msg.id;
fillText(clone, '[data-field="username"]', msg.username);
fillText(clone, '[data-field="content"]', msg.content || '');
fillText(clone, '[data-field="created_at"]', msg.created_at || '');
var delBtn = clone.querySelector('.md');
if (delBtn) delBtn.dataset.id = msg.id;
return clone;
}

function renderMessageList(container, messages) {
container.innerHTML = '';
if (!messages || messages.length === 0) {
renderEmpty(container);
return;
}
var fragment = document.createDocumentFragment();
messages.forEach(function(msg) {
var clone = renderMessageItem(msg);
fragment.appendChild(clone);
});
container.appendChild(fragment);
}

function renderStatsCard(label, count) {
var clone = cloneTemplate('tpl-stats-card');
fillText(clone, '[data-field="count"]', count);
fillText(clone, '[data-field="label"]', label);
return clone;
}

function renderStatsList(container, views, total) {
container.innerHTML = '';
var pathMap = { '/login': '登录', '/register': '注册', '/': '聊天', '/profile': '设置' };
var counts = {};
Object.keys(pathMap).forEach(function(p) { counts[p] = 0; });
views.forEach(function(v) {
if (pathMap[v.path]) counts[v.path] = v.count;
});

var header = document.createElement('div');
header.style.cssText = 'padding:4px 0;font-weight:600;color:#0a0a0a;border-bottom:1px solid #e5e5e5;padding-bottom:8px;display:flex;justify-content:space-between;';
header.innerHTML = '<span>总访问量：' + total + '</span>';
container.appendChild(header);

var grid = document.createElement('div');
grid.className = 'sg';
Object.keys(pathMap).forEach(function(p) {
var card = renderStatsCard(pathMap[p], counts[p] || 0);
grid.appendChild(card);
});
container.appendChild(grid);
}

async function loadUserList() {
if (uload) return;
renderLoading(ul);
try {
var r = await apiCall('/api/admin/users', 'GET');
if (!r.success) {
if (r.error === '未登录' || r.error === '权限不足') {
window.location.href = '/admin';
return;
}
renderError(ul, r.error || '加载失败');
return;
}
var users = r.users || [];
var total = users.length;
var todayCount = users.filter(function(u) { return isToday(u.created_at); }).length;
tu.textContent = total;
tdd.textContent = todayCount;
uc.textContent = '(' + total + ')';
renderUserList(ul, users);
uload = true;
toast.success('用户列表加载成功');
} catch (e) {
renderError(ul, '加载失败，请刷新');
}
}

async function loadMessages() {
if (mload) return;
renderLoading(ml);
try {
var r = await apiCall('/api/admin/messages', 'GET');
if (!r.success) {
renderError(ml, r.error || '加载失败');
return;
}
var msgs = r.messages || [];
mc2.textContent = '(' + msgs.length + ')';
renderMessageList(ml, msgs);
mload = true;
toast.success('消息列表加载成功');
} catch (e) {
renderError(ml, '加载失败');
}
}

async function loadAnnouncement() {
if (aload) return;
try {
var r = await apiCall('/api/announcement', 'GET');
if (r.success) {
asw.checked = r.is_active;
ati.value = r.title || '';
acn.value = r.content || '';
aload = true;
}
} catch (e) {}
}

async function loadStats() {
if (sload) return;
renderLoading(stl);
try {
var r = await apiCall('/api/admin/page-views', 'GET');
if (!r.success) {
renderError(stl, r.error || '加载失败');
return;
}
var views = r.views || [];
stc.textContent = '(' + views.length + ')';
renderStatsList(stl, views, r.total);
sload = true;
toast.success('统计信息加载成功');
} catch (e) {
renderError(stl, '加载失败');
}
}

mt.addEventListener('click', function() {
mopen = !mopen;
mb.classList.toggle('op');
var a = ma.querySelector('img');
if (a) a.classList.toggle('rt');
if (mopen) loadMessages();
});

ut.addEventListener('click', function() {
uopen = !uopen;
ub.classList.toggle('op');
var a = ua.querySelector('img');
if (a) a.classList.toggle('rt');
if (uopen) loadUserList();
});

stt.addEventListener('click', function() {
sopen = !sopen;
stb.classList.toggle('op');
var a = sta.querySelector('img');
if (a) a.classList.toggle('rt');
if (sopen && !sload) loadStats();
});

at.addEventListener('click', function() {
aopen = !aopen;
ab2.classList.toggle('op');
var a = aa.querySelector('img');
if (a) a.classList.toggle('rt');
if (aopen && !aload) loadAnnouncement();
});

ml.addEventListener('click', async function(e) {
var btn = e.target.closest('.md');
if (!btn) return;
var id = btn.dataset.id;
var item = btn.closest('.mi');
try {
var r = await apiCall('/api/admin/messages/' + id, 'DELETE');
if (r.success) {
toast.success(r.message);
if (item && item.parentNode) item.remove();
var rem = ml.querySelectorAll('.mi').length;
mc2.textContent = '(' + rem + ')';
if (!rem) renderEmpty(ml);
} else {
toast.error(r.error || '删除失败');
}
} catch (e) {
toast.error('网络错误');
}
});

ul.addEventListener('click', async function(e) {
var btn = e.target.closest('.bs');
if (!btn) return;
var uid = btn.dataset.id;
var action = btn.dataset.action;

if (action === 'deleteUser') {
if (!confirm('确定要删除这个用户吗？此操作不可恢复！')) return;
var r = await apiCall('/api/admin/users/' + uid, 'DELETE');
if (r.success) {
toast.success(r.message);
uload = false;
loadUserList();
var u = await apiCall('/api/admin/users', 'GET');
if (u.success) {
tu.textContent = u.users.length;
uc.textContent = '(' + u.users.length + ')';
}
} else {
toast.error(r.error || '删除失败');
}
} else if (action === 'resetPwd') {
cru = uid;
np.value = '';
rp.classList.add('ac');
} else if (action === 'updatePoints') {
cpu = uid;
pi2.value = '';
up.classList.add('ac');
}
});

rc.addEventListener('click', function() {
rp.classList.remove('ac');
cru = null;
});

rcc.addEventListener('click', async function() {
var p = np.value.trim();
if (p.length < 6) { toast.error('密码至少6位'); return; }
var r = await apiCall('/api/admin/users/' + cru + '/reset-password', 'POST', { new_password: p });
if (r.success) {
toast.success(r.message);
rp.classList.remove('ac');
cru = null;
} else {
toast.error(r.error || '重置失败');
}
});

rp.addEventListener('click', function(e) {
if (e.target === rp) { rp.classList.remove('ac'); cru = null; }
});

pc.addEventListener('click', function() {
up.classList.remove('ac');
cpu = null;
});

pc2.addEventListener('click', async function() {
var v = pi2.value.trim();
if (v === '') { toast.error('请输入积分'); return; }
var p = parseInt(v, 10);
if (isNaN(p)) { toast.error('请输入有效整数'); return; }
var r = await apiCall('/api/admin/users/' + cpu + '/update-points', 'POST', { points: p });
if (r.success) {
toast.success(r.message);
up.classList.remove('ac');
cpu = null;
uload = false;
loadUserList();
} else {
toast.error(r.error || '更新失败');
}
});

up.addEventListener('click', function(e) {
if (e.target === up) { up.classList.remove('ac'); cpu = null; }
});

$('logoutBtn').addEventListener('click', async function() {
await apiCall('/api/logout', 'POST');
window.location.href = '/admin';
});

asb.addEventListener('click', async function() {
var t = ati.value.trim();
var c = acn.value.trim();
if (!t || !c) { toast.error('标题和内容不能为空'); return; }
var r = await apiCall('/api/admin/announcement', 'POST', {
title: t,
content: c,
is_active: asw.checked
});
if (r.success) toast.success(r.message);
else toast.error(r.error || '修改失败');
});

toast.success('Hello Admin');
loadMessages();
loadUserList();
loadStats();
loadAnnouncement();
</script>
</body>
</html>
