<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reax - 聊天1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
*{margin: 0;padding: 0;box-sizing: border-box;-webkit-tap-highlight-color: rgba(0, 0, 0, 0);font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
html,body{width:100%;height:100%;background:#f8f9fa;overflow:hidden}
.ct{width:100%;height:100%;display:flex;flex-direction:column;background:#f8f9fa}
.i{display:inline-block;vertical-align:middle;flex-shrink:0;width:16px;height:16px;filter:brightness(0)saturate(100%)}
.is{width:14px;height:14px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.im{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.ig{filter:brightness(0)saturate(0%)opacity:0.6}
.sp{animation:spn 1.5s linear infinite;display:inline-block}
@keyframes spn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hd{padding:12px 16px;background:#0a0a0a;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hd .lf{display:flex;align-items:center;gap:10px;cursor:pointer}
.hd .lf .ha{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;background:#e5e7eb;filter:brightness(0)saturate(0%)opacity:0.6}
.hd .lf .ha2{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:none;display:block}
.hd .lf .hu{font-size:16px;font-weight:600;color:#fff}
.hd .rg{display:flex;align-items:center;gap:12px}
.hd .rg .bi{background:rgba(255,255,255,0.12);color:#fff;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:15px;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.hd .rg .bi:hover{background:rgba(255,255,255,0.25)}
.hd .rg .bi .lb{font-size:13px;font-weight:500}
.hd .rg .bi .is{filter:brightness(0)invert(1)}
.ms{flex:1;padding:16px 20px;overflow-y:auto;background:#f8f9fa}
.ls{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:14px;gap:12px}
.ls .i{width:32px;height:32px;filter:brightness(0)saturate(0%)opacity:0.4}
.msg{margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;max-width:100%}
.msg.sf{flex-direction:row-reverse}
.msg .aw{flex-shrink:0;width:36px;height:36px;border-radius:50%;overflow:hidden;background:#e5e7eb;cursor:pointer}
.msg .aw img{width:100%;height:100%;object-fit:cover;display:block}
.msg .aw .i{width:36px;height:36px;filter:none;padding:6px;background:#e5e7eb}
.msg .mc{display:flex;flex-direction:column;max-width:70%;min-width:0}
.msg.sf .mc{align-items:flex-end}
.msg.ot .mc{align-items:flex-start}
.msg .sn{font-size:12px;color:#888;margin-bottom:2px;padding:0 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .bb{padding:10px 14px;border-radius:12px;font-size:14px;word-wrap:break-word;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;max-width:100%}
.msg.sf .bb{background:#0a0a0a;color:#fff;border-bottom-right-radius:4px}
.msg.ot .bb{background:#e9ecef;color:#333;border-bottom-left-radius:4px}
.msg .bb.io{background:transparent!important;padding:0!important;border-radius:0!important;color:inherit}
.msg .bb.io img{max-width:100%;max-height:400px;border-radius:8px;display:block;margin:4px 0}
.msg .bb img{max-width:100%;max-height:250px;border-radius:8px;margin:4px 0;display:block}
.msg .tm{font-size:10px;color:#aaa;margin-top:2px;padding:0 4px}
.ep{text-align:center;color:#aaa;padding:40px 0;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ep .i{width:32px;height:32px;opacity:.3;filter:brightness(0)saturate(100%)}
.ia{padding:12px 16px;border-top:1px solid #e5e5e5;display:flex;gap:8px;background:#fff;flex-shrink:0;align-items:flex-end}
.ia textarea{flex:1;padding:10px 14px;border:1px solid #e5e5e5;border-radius:10px;font-size:14px;outline:none;resize:none;max-height:120px;min-height:44px;line-height:1.5;font-family:inherit;background:#f8f9fa;transition:border-color .2s}
.ia textarea:focus{border-color:#0a0a0a;background:#fff}
.ia .sb{padding:10px 20px;background:#0a0a0a;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:background .2s;display:flex;align-items:center;gap:6px;flex-shrink:0;height:44px;align-self:flex-end;white-space:nowrap}
.ia .sb:hover{background:#222}
.ia .sb:disabled{opacity:.7;cursor:not-allowed}
.ia .sb .is{filter:brightness(0)invert(1)}
.pb{background:#f0f0f0;border:1px solid #e5e5e5;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;height:44px;width:44px;padding:0;align-self:flex-end;transition:background 0.2s}
.pb:hover{background:#f0f0f0}
.pb:active{background:#f0f0f0}
.pb:focus{background:#f0f0f0;outline:none}
.pb .pi{width:24px;height:24px;display:block;transition:transform 0.3s ease}
.pb .pi.rt{transform:rotate(45deg)}
.fp{background:#fff;border-top:1px solid #e5e5e5;padding:0 16px;max-height:0;overflow:hidden;opacity:0;flex-shrink:0;transition:max-height 0.35s ease, padding 0.35s ease, opacity 0.35s ease;display:flex;gap:8px;justify-content:space-around;flex-wrap:wrap}
.fp.op{max-height:120px;padding:12px 16px;opacity:1}
.fi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background 0.2s;min-width:60px;flex:1;max-width:80px}
.fi:hover{background:#f0f0f0}
.fi .fi2{width:24px;height:24px;filter:brightness(0)saturate(100%)}
.fi .fl{font-size:12px;color:#333;font-weight:500;white-space:nowrap}
.ao{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998;display:flex;justify-content:center;align-items:center;padding:20px}
.ao.hd2{display:none}
.am{background:#fff;border-radius:16px;padding:24px 24px 16px;max-width:400px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.3);text-align:center;position:relative}
.am .tl{border-top:2px solid #000;margin-bottom:16px;padding-top:8px}
.am h2{font-size:20px;margin-bottom:12px;color:#0a0a0a;margin-top:0}
.am .ac2{font-size:15px;color:#333;margin-bottom:20px;white-space:pre-wrap;word-break:break-word;line-height:1.6;max-height:200px;overflow-y:auto;text-align:left}
.am .dr{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin-bottom:14px}
.am .dr input[type="checkbox"]{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:#000}
.am .dr label{font-size:14px;color:#555;cursor:pointer}
.am .bc2{display:block;width:100%;padding:10px 0;background:#0a0a0a;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:4px}
.am .bc2:hover{background:#222}
.ap{width:36px;height:36px;border-radius:50%;background:#e5e7eb;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ap img{width:100%;height:100%;object-fit:cover}
.hi{display:none}
.lm{text-align:center;padding:12px 0;color:#aaa;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.lm .i{width:18px;height:18px;filter:brightness(0)saturate(0%)opacity:0.6}
.nm{text-align:center;padding:12px 0;color:#bbb;font-size:13px}
.cb{background:#1e1e1e;color:#d4d4d4;border-radius:8px;margin:0;overflow:hidden;font-size:13px;position:relative}
.cb .ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#2d2d2d;border-bottom:1px solid #3d3d3d;font-family:monospace;font-size:12px;color:#aaa}
.cb .ch .cl{text-transform:lowercase;font-weight:600;color:#d4d4d4}
.cb .ch .ca{display:flex;gap:8px}
.cb .ch .ca button{background:transparent;border:none;color:#ddd;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:0;font-family:inherit;display:flex;align-items:center;gap:1px;transition:color .2s}
.cb .ch .ca button:hover{color:#fff}
.cb .cb2{padding:4px 8px;overflow-y:auto;overflow-x:auto;white-space:pre;word-break:normal;font-family:'Menlo','Consolas','Monaco',monospace;font-size:12px;line-height:1.6;max-height:300px;scrollbar-width:thin;scrollbar-color:#888 #1e1e1e}
.cb .cb2::-webkit-scrollbar{width:6px;height:0}
.cb .cb2::-webkit-scrollbar-track{background:#1e1e1e;border-radius:4px}
.cb .cb2::-webkit-scrollbar-thumb{background:#888;border-radius:4px}
.cb .cb2::-webkit-scrollbar-thumb:hover{background:#aaa}
.cb .cb2 code{font-family:inherit;background:transparent;padding:0;white-space:pre;display:block;word-break:normal}
.cri{width:14px;height:14px;filter:brightness(0)invert(1);vertical-align:middle}
.cci{width:14px;height:14px;filter:brightness(0)invert(1);vertical-align:middle}
</style>
</head>
<body>

<div class="ct">
  <div class="hd">
    <div class="lf" id="headerProfileBtn">
      <div id="headerAvatarContainer">
        <div class="ap"><img src="/svg/avatar.svg"></div>
      </div>
      <span class="hu" id="headerUsername">加载中...</span>
    </div>
    <div class="rg"><button class="bi" id="settingsBtn"><img src="/svg/gear.svg" class="is"><span class="lb">设置</span></button></div>
  </div>

  <div class="ms" id="messagesContainer">
    <div class="ls" id="loadingIndicator"><img src="/svg/loading.svg" class="i sp"><span>加载中...</span></div>
  </div>

  <div class="ia">
    <textarea id="messageInput" placeholder="输入消息..." maxlength="1000" rows="1"></textarea>
    <button class="pb" id="plusBtn"><img src="/svg/plus.svg" class="pi"></button>
    <button class="sb" id="sendBtn"><img src="/svg/send.svg" class="is"> 发送</button>
  </div>

  <div class="fp" id="functionPanel">
    <div class="fi" id="funcUpload"><img src="/svg/img.svg" class="fi2" id="funcIcon1"><span class="fl" id="funcLabel1">图片</span></div>
    <div class="fi" id="funcAI"><img src="/svg/code.svg" class="fi2"><span class="fl">调用AI</span></div>
    <div class="fi" data-func="3"><img src="/svg/time.svg" class="fi2"><span class="fl">测试3</span></div>
    <div class="fi" data-func="4"><img src="/svg/time.svg" class="fi2"><span class="fl">测试4</span></div>
  </div>
</div>

<div class="ao hd2" id="announceOverlay">
  <div class="am">
    <div class="tl"></div>
    <h2 id="announceTitle">公告标题</h2>
    <div class="ac2" id="announceContent"></div>
    <div class="dr"><input type="checkbox" id="announceDismiss"><label for="announceDismiss">不再弹出此公告</label></div>
    <button class="bc2" id="announceConfirm">确认</button>
  </div>
</div>

<input type="file" id="imageInput" accept="image/*" class="hi">

<template id="tpl-message">
  <div class="msg">
    <div class="aw"><img src="" data-field="avatar"></div>
    <div class="mc">
      <div class="sn" data-field="username"></div>
      <div class="bb" data-field="content"></div>
      <div class="tm" data-field="time"></div>
    </div>
  </div>
</template>

<template id="tpl-loading-indicator">
  <div class="ls" id="loadingIndicator"><img src="/svg/loading.svg" class="i sp"><span>加载中...</span></div>
</template>

<template id="tpl-empty-messages">
  <div class="ep"><img src="/svg/chat.svg" class="i"> 暂无消息</div>
</template>

<template id="tpl-no-more">
  <div class="nm">没有内容了</div>
</template>

<template id="tpl-load-more">
  <div class="lm"><img src="/svg/loading.svg" class="i sp"> 加载消息中...</div>
</template>

<template id="tpl-code-block">
  <div class="cb">
    <div class="ch">
      <span class="cl" data-field="lang">text</span>
      <span class="ca">
        <button class="code-copy"><img src="/svg/copy.svg" class="cci"> 复制</button>
        <button class="code-run"><img src="/svg/code.svg" class="cri"> 运行</button>
      </span>
    </div>
    <div class="cb2"><code class="hljs" data-field="code"></code></div>
  </div>
</template>

<script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
<script src="/api/toast.js"></script>
<script>
"use strict";

function cloneTemplate(id) {
  const tpl = document.getElementById(id);
  return tpl.content.cloneNode(true);
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    if (m === "'") return '&#039;';
    return m;
  });
}

function decodeHtml(h) {
  if (!h) return '';
  const t = document.createElement('textarea');
  t.innerHTML = h;
  return t.value;
}

function compressImage(file, maxWidth, quality) {
  maxWidth = maxWidth || 800;
  quality = quality || 0.7;
  return new Promise(function(resolve) {
    var r = new FileReader();
    r.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var c = document.createElement('canvas');
        var w = img.width;
        var h = img.height;
        if (w > maxWidth) {
          h = h * maxWidth / w;
          w = maxWidth;
        }
        c.width = w;
        c.height = h;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        c.toBlob(function(blob) {
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

function urlify(text) {
  var urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, function(url) {
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#1677ff;text-decoration:underline;word-break:break-all;">' + url + '</a>';
  });
}

function getAvatarUrl(qq) {
  return qq ? 'https://q1.qlogo.cn/g?b=qq&nk=' + qq + '&s=640' : null;
}

function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

var $ = function(id) { return document.getElementById(id); };
var mc = $('messagesContainer');
var mi = $('messageInput');
var sb = $('sendBtn');
var hu = $('headerUsername');
var hac = $('headerAvatarContainer');
var hpb = $('headerProfileBtn');
var st = $('settingsBtn');
var li = $('loadingIndicator');
var ao = $('announceOverlay');
var at = $('announceTitle');
var ac = $('announceContent');
var ad = $('announceDismiss');
var acf = $('announceConfirm');
var ii = $('imageInput');
var pb = $('plusBtn');
var fp = $('functionPanel');
var pi = pb.querySelector('.pi');
var fu = $('funcUpload');
var fIcon = $('funcIcon1');
var fLabel = $('funcLabel1');
var funcAI = $('funcAI');

var un = '';
var pusher = null;
var channel = null;
var myAvatar = null;
var channelBound = false;
var longPress = null;
var historyLoaded = false;
var currentOffset = 0;
var pageSize = 20;
var hasMore = true;
var isLoading = false;
var firstLoad = true;
var isUploading = false;
var isAiPending = false;

function renderMessage(sender, text, time, avatarUrl, isSelf) {
  var clone = cloneTemplate('tpl-message');
  var msgDiv = clone.querySelector('.msg');
  var avatarImg = clone.querySelector('[data-field="avatar"]');
  var usernameEl = clone.querySelector('[data-field="username"]');
  var contentEl = clone.querySelector('[data-field="content"]');
  var timeEl = clone.querySelector('[data-field="time"]');

  if (isSelf) msgDiv.classList.add('sf');
  else msgDiv.classList.add('ot');

  if (avatarUrl) {
    avatarImg.src = avatarUrl;
  } else {
    avatarImg.src = '/svg/avatar.svg';
  }

  usernameEl.textContent = sender;
  timeEl.textContent = time || '刚刚';
  var decoded = decodeHtml(text);
  var rendered = renderContent(decoded);
  contentEl.innerHTML = rendered;
  if (/^!\[.*?\]\(.*?\)$/.test(decoded.trim())) {
    contentEl.classList.add('io');
  }

  var codeEl = contentEl.querySelector('code');
  if (codeEl && typeof hljs !== 'undefined') {
    hljs.highlightElement(codeEl);
  }

  var aw = msgDiv.querySelector('.aw');
  aw.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  });
  aw.addEventListener('pointerdown', function(e) {
    this._longPressTriggered = false;
    var target = this.dataset.sender || sender;
    longPress = setTimeout(function() {
      if (target && target !== un) {
        var cur = mi.value;
        var mention = '@' + target + ' ';
        var pos = mi.selectionStart || 0;
        mi.value = cur.slice(0, pos) + mention + cur.slice(pos);
        var newPos = pos + mention.length;
        mi.selectionStart = newPos;
        mi.selectionEnd = newPos;
        mi.focus();
        autoResizeTextarea(mi);
        toast.success('已@用户: ' + target);
      }
      this._longPressTriggered = true;
      longPress = null;
    }.bind(this), 500);
  });
  aw.addEventListener('pointerup', function(e) {
    if (longPress) {
      clearTimeout(longPress);
      longPress = null;
      var link = this.dataset.link;
      if (link) window.location.href = link;
    }
  });
  aw.addEventListener('pointerleave', function() {
    clearTimeout(longPress);
    longPress = null;
  });

  return clone;
}

function renderContent(text) {
  if (!text) return '';
  var imgMatch = text.match(/!\[.*?\]\((.*?)\)/);
  if (imgMatch) {
    var u = escapeHtml(imgMatch[1]);
    return '<img src="' + u + '" loading="lazy" style="max-width:100%;max-height:250px;border-radius:8px;margin:4px 0;" onerror="this.style.display=\'none\'">';
  }
  var codeBlockRegex = /(```)(\w+)?\n([\s\S]*?)\n\1/g;
  var result = text;
  var parts = [];
  var lastIndex = 0;
  var match;
  while ((match = codeBlockRegex.exec(text)) !== null) {
    var before = text.substring(lastIndex, match.index);
    if (before) parts.push(urlify(escapeHtml(before)).replace(/\n/g, '<br>'));
    var lang = match[2] || 'text';
    var code = match[3];
    parts.push(renderCodeBlock(lang, code));
    lastIndex = codeBlockRegex.lastIndex;
  }
  if (lastIndex < text.length) {
    parts.push(urlify(escapeHtml(text.substring(lastIndex))).replace(/\n/g, '<br>'));
  }
  return parts.join('');
}

function renderCodeBlock(lang, code) {
  var clone = cloneTemplate('tpl-code-block');
  var langEl = clone.querySelector('[data-field="lang"]');
  var codeEl = clone.querySelector('[data-field="code"]');
  langEl.textContent = lang || 'text';
  codeEl.textContent = code;
  codeEl.className = 'hljs language-' + (lang || 'text');
  return clone;
}

function renderLoadingIndicator() {
  var clone = cloneTemplate('tpl-loading-indicator');
  return clone;
}

function renderEmptyMessages() {
  var clone = cloneTemplate('tpl-empty-messages');
  return clone;
}

function renderNoMore() {
  var clone = cloneTemplate('tpl-no-more');
  return clone;
}

function renderLoadMore() {
  var clone = cloneTemplate('tpl-load-more');
  return clone;
}

function updateHeaderAvatar(url) {
  if (url) {
    hac.innerHTML = '<img class="ha2" src="' + url + '" style="width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:none;display:block;">';
  } else {
    hac.innerHTML = '<div class="ap"><img src="/svg/avatar.svg"></div>';
  }
}

function addMessage(sender, text, time, avatarUrl, isSelf, prepend) {
  var ld = document.getElementById('loadingIndicator');
  if (ld) ld.remove();
  var emp = mc.querySelector('.ep');
  if (emp) emp.remove();

  var self = (isSelf !== undefined) ? isSelf : (sender === un);
  var clone = renderMessage(sender, text, time, avatarUrl, self);
  var msgDiv = clone.querySelector('.msg');

  var aw = msgDiv.querySelector('.aw');
  var link = self ? '/profile' : '/user?id=' + encodeURIComponent(sender);
  aw.dataset.link = link;
  aw.dataset.sender = sender;

  if (prepend) {
    mc.insertBefore(clone, mc.firstChild);
  } else {
    mc.appendChild(clone);
  }

  var codeEl = msgDiv.querySelector('code');
  if (codeEl && typeof hljs !== 'undefined') {
    hljs.highlightElement(codeEl);
  }
}

function showEmpty() {
  var ld = document.getElementById('loadingIndicator');
  if (ld) ld.remove();
  if (mc.querySelector('.ep')) return;
  mc.appendChild(renderEmptyMessages());
}

function showNoMore() {
  var el = mc.querySelector('.nm');
  if (!el) {
    mc.insertBefore(renderNoMore(), mc.firstChild);
  }
}

function hideNoMore() {
  var el = mc.querySelector('.nm');
  if (el) el.remove();
}

function showLoadMore() {
  var el = mc.querySelector('.lm');
  if (!el) {
    mc.insertBefore(renderLoadMore(), mc.firstChild);
  }
}

function hideLoadMore() {
  var el = mc.querySelector('.lm');
  if (el) el.remove();
}

function loadMessages(offset, prepend) {
  if (isLoading) return Promise.resolve();
  isLoading = true;
  var oldScrollTop = 0;
  var oldScrollHeight = 0;
  if (prepend) {
    showLoadMore();
    oldScrollTop = mc.scrollTop;
    oldScrollHeight = mc.scrollHeight;
  }
  var url = '/api/messages?limit=' + pageSize + '&offset=' + offset;
  return fetch(url, { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (prepend) hideLoadMore();
      if (d.success && d.messages) {
        if (d.messages.length === 0) {
          hasMore = false;
          if (offset === 0) {
            showEmpty();
          } else {
            showNoMore();
          }
          return;
        }
        if (offset === 0) {
          mc.innerHTML = '';
          d.messages.forEach(function(msg) {
            var t = new Date(msg.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            addMessage(msg.username, msg.content, t, msg.avatar_url, msg.username === un);
          });
          mc.scrollTop = mc.scrollHeight;
        } else {
          d.messages.forEach(function(msg) {
            var t = new Date(msg.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            addMessage(msg.username, msg.content, t, msg.avatar_url, msg.username === un, true);
          });
          var newScrollHeight = mc.scrollHeight;
          var delta = newScrollHeight - oldScrollHeight;
          mc.scrollTop = oldScrollTop + delta;
        }
        if (d.messages.length < pageSize) {
          hasMore = false;
          if (offset !== 0) {
            showNoMore();
          }
        } else {
          hideNoMore();
        }
      } else {
        toast.error('加载消息失败');
      }
    })
    .catch(function() {
      if (prepend) hideLoadMore();
      toast.error('网络错误');
    })
    .finally(function() {
      isLoading = false;
      if (firstLoad) {
        firstLoad = false;
        historyLoaded = true;
        toast.success('数据库连接成功');
      }
    });
}

function loadHistory() {
  return loadMessages(0, false);
}

function handleNewMessage(msg) {
  var t = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  addMessage(msg.username, msg.content, t, msg.avatar_url, msg.username === un);
  mc.scrollTop = mc.scrollHeight;
}

function initPusher() {
  if (pusher && channelBound) return;
  fetch('/api/pusher/config', { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.success) {
        toast.error('连接聊天失败');
        return;
      }
      pusher = new Pusher(d.key, { cluster: d.cluster });
      function bindOnce() {
        if (channelBound) return;
        if (!channel) channel = pusher.subscribe('chat');
        channel.bind('new-message', handleNewMessage);
        channelBound = true;
      }
      pusher.connection.bind('state_change', function(states) {
        if (states.current === 'connected') bindOnce();
      });
      if (pusher.connection.state === 'connected') bindOnce();
    })
    .catch(function() {
      toast.error('连接聊天失败');
    });
}

function checkAnnouncement() {
  fetch('/api/announcement', { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) {
        var stored = localStorage.getItem('announce_dismiss');
        var isDismissed = (stored === d.updated_at);
        if (d.is_active && !isDismissed) {
          toast.success('公告加载成功');
          at.textContent = d.title || '公告';
          ac.textContent = d.content || '';
          ad.checked = false;
          ao.classList.remove('hd2');
        }
      }
    })
    .catch(function() {});
}

acf.addEventListener('click', function() {
  toast.success('你已确认公告');
  if (ad.checked) {
    fetch('/api/announcement', { credentials: 'include' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success && d.updated_at) {
          localStorage.setItem('announce_dismiss', d.updated_at);
        }
      })
      .catch(function() {});
  }
  ao.classList.add('hd2');
});

function sendMessage() {
  var text = mi.value.trim();
  if (!text) return;
  var isAi = (un !== '纪失' && text.startsWith('@纪失 '));
  var q = '';
  if (isAi) q = text.substring(4).trim();

  sb.disabled = true;
  sb.innerHTML = '<img src="/svg/loading.svg" class="is sp"> 发送中...';
  mi.value = '';
  autoResizeTextarea(mi);

  fetch('/api/send-message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ content: text })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.success) {
        toast.error(d.error || '发送失败');
        sb.disabled = false;
        sb.innerHTML = '<img src="/svg/send.svg" class="is"> 发送';
        return;
      }
      if (isAi && q && !isAiPending) {
        isAiPending = true;
        var delay = Math.floor(Math.random() * 3000) + 2000;
        setTimeout(function() {
          fetch('/api/ai-ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username: un, question: q })
          })
            .then(function(r) { return r.json(); })
            .then(function(ad) {
              if (!ad.success) toast.error('请求失败：' + (ad.error || '未知错误'));
            })
            .catch(function() { toast.error('网络错误'); })
            .finally(function() { isAiPending = false; });
        }, delay);
      }
    })
    .catch(function() {
      toast.error('发送失败');
    })
    .finally(function() {
      sb.disabled = false;
      sb.innerHTML = '<img src="/svg/send.svg" class="is"> 发送';
      mi.blur();
    });
}

ii.addEventListener('change', function() {
  var file = this.files[0];
  if (!file) return;
  if (isUploading) return;
  if (file.size > 200 * 1024) {
    compressImage(file, 800, 0.7).then(function(compressed) {
      doUpload(compressed);
    }).catch(function() {
      toast.error('图片压缩失败');
      this.value = '';
    }.bind(this));
    return;
  }
  doUpload(file);
});

function doUpload(file) {
  if (file.size > 7.5 * 1024 * 1024) {
    toast.error('图片不能超过7.5MB');
    ii.value = '';
    return;
  }
  isUploading = true;
  fIcon.src = '/svg/loading.svg';
  fIcon.classList.add('sp');
  fLabel.textContent = '上传中...';
  var fd = new FormData();
  fd.append('image', file);
  fetch('/api/upload-image', {
    method: 'POST',
    body: fd,
    credentials: 'include'
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) toast.success('图片已发送');
      else toast.error(data.error || '上传失败');
    })
    .catch(function() {
      toast.error('网络错误，请重试');
    })
    .finally(function() {
      fIcon.src = '/svg/img.svg';
      fIcon.classList.remove('sp');
      fLabel.textContent = '图片';
      isUploading = false;
      ii.value = '';
    });
}

function copyCode(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      toast.success('代码已复制');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.left = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast.success('代码已复制');
  } catch (e) {
    toast.error('复制失败，请手动复制');
  }
  document.body.removeChild(ta);
}

mc.addEventListener('click', function(e) {
  var target = e.target.closest('.code-copy');
  if (target) {
    var block = target.closest('.cb');
    var codeEl = block.querySelector('.cb2 code');
    var text = codeEl.textContent;
    copyCode(text);
    e.preventDefault();
    return;
  }
  var runTarget = e.target.closest('.code-run');
  if (runTarget) {
    var block = runTarget.closest('.cb');
    var codeEl = block.querySelector('.cb2 code');
    var text = codeEl.textContent;
    var newWin = window.open('', '_blank');
    if (newWin) {
      newWin.document.write(text);
      var titleMatch = text.match(/<title>(.*?)<\/title>/i);
      if (titleMatch && titleMatch[1]) {
        newWin.document.title = titleMatch[1];
      }
      newWin.document.close();
    } else {
      toast.error('请允许弹出窗口');
    }
    e.preventDefault();
  }
});

mi.addEventListener('input', function() {
  autoResizeTextarea(this);
});

sb.addEventListener('click', sendMessage);
mi.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

hpb.addEventListener('click', function() {

});
st.addEventListener('click', function() {

mc.addEventListener('scroll', function() {

    currentOffset += pageSize;
    loadMessages(currentOffset, true);
  }
  sessionStorage.setItem('chat_scroll_top', this.scrollTop.toString());
});

fp.querySelectorAll('.fi:not(#funcUpload):not(#funcAI)').forEach(function(item) {

funcAI.addEventListener('click', function() {

});

var initStart = performance.now();

Promise.all([
  fetch('/api/user', { credentials: 'include' }),
  fetch('/api/messages?limit=20', { credentials: 'include' })
])
.then(function(responses) {
  return Promise.all([responses[0].json(), responses[1].json()]);
})
.then(function(results) {
  var userData = results[0];
  var messagesData = results[1];
  if (!userData.success) {
    window.location.href = '/login';
    return;
  }
  un = userData.username;
  hu.textContent = un;
  if (userData.qq_number) {
    myAvatar = 'https://q1.qlogo.cn/g?b=qq&nk=' + userData.qq_number + '&s=640';
  } else {
    myAvatar = null;
  }
  updateHeaderAvatar(myAvatar);

  if (messagesData.success && messagesData.messages) {
    mc.innerHTML = '';
    var msgs = messagesData.messages;
    if (msgs.length === 0) {
      showEmpty();
    } else {
      msgs.forEach(function(msg) {
        var t = new Date(msg.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        addMessage(msg.username, msg.content, t, msg.avatar_url, msg.username === un);
      });
      if (msgs.length < pageSize) {
        hasMore = false;
        showNoMore();
      }
      mc.scrollTop = mc.scrollHeight;
    }
    historyLoaded = true;
    firstLoad = false;
    toast.success('数据库连接成功');
  } else {
    toast.error('加载消息失败');
  }

  initPusher();
  setTimeout(checkAnnouncement, 2000);
})
.catch(function() {
  window.location.href = '/login';
});
