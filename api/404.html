<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 - 页面不存在</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;display:flex;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f7f7f7;background-image:linear-gradient(rgba(0,0,0,0.04)1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.04)1px,transparent 1px);background-size:40px 40px;padding:20px}.container{max-width:480px;width:100%;text-align:center}.code{font-size:80px;font-weight:700;color:#0a0a0a;line-height:1;letter-spacing:-2px}.title{font-size:26px;font-weight:600;color:#222;margin-top:12px}.desc{font-size:13px;color:#999;margin-top:8px;line-height:1.6}.divider{width:48px;height:2px;background:#0a0a0a;margin:20px auto 24px}.btn{display:inline-block;padding:10px 28px;background:#0a0a0a;color:#fff;text-decoration:none;border-radius:8px;font-size:14px;transition:background .2s}.btn:hover{background:#222}@media(max-width:480px){.code{font-size:56px}.title{font-size:20px}.desc{font-size:12px}}</style>
</head>
<body>
<div class="container">
<div class="code">404</div>
<div class="title">页面未找到</div>
<div class="desc">您访问的页面不存在或已被删除 请检查访问的链接是否正确</div>
<div class="divider"></div>
<a href="/" class="btn">← 返回首页</a>
</div>
</body>
</html>
